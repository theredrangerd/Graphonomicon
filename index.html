<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphonomicon — interactive IB Economics graphs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/pages.css">
</head>
<body class="home">
  <div id="site-bar"></div>
  <main class="page">
    <div id="hero"></div>
    <div class="search-bar">
      <input id="search-input" type="text" aria-label="Search graphs" placeholder="Type any graph you want — “minimum wage”, “deadweight loss”…" autocomplete="off">
    </div>
    <div id="bento"></div>
    <div id="search-results" hidden></div>
    <p id="no-results" class="no-results" role="status" aria-live="polite" hidden>No graphs match that search yet — try a different word, or check back as more get added.</p>
  </main>
  <script type="module" src="/src/pages/home-entry.js"></script>
</body>
</html>
